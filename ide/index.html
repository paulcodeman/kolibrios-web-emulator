<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KOS IDE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/monokai.min.css" />
<link rel="stylesheet" href="../src/style.css" />
<link rel="stylesheet" href="ide.css" />
</head>
<body>
<nav class="navbar">
  <a href="../index.html" class="navbar-brand">KolibriOS Emulator</a>
  <div class="navbar-links">
    <a href="../launcher.html"><i class="fa-solid fa-display"></i> Desktop</a>
    <a href="../apps.html"><i class="fa-solid fa-cubes"></i> Apps</a>
    <a href="../marketplace.html"><i class="fa-solid fa-store"></i> Marketplace</a>
    <a href="index.html" class="active"><i class="fa-solid fa-code"></i> IDE</a>
  </div>
</nav>
<div id="ide">
  <div id="editorPane">
    <div id="toolbar">
      <h1><i class="fa-solid fa-code"></i> KOS IDE</h1>
      <select id="exampleSelect"></select>
      <button id="compileRunBtn" class="primary"><i class="fa-solid fa-play"></i> Assemble &amp; Run</button>
      <button id="stopBtn"><i class="fa-solid fa-stop"></i> Stop</button>
      <span id="status"></span>
    </div>
    <div id="editor"></div>
  </div>
  <div id="emulatorPane">
    <div class="screen-panel" id="screenPanel">
      <div class="workspace" id="workspace">
        <div class="workspace-empty" id="workspaceEmpty"><i class="fa-solid fa-download"></i> Assemble &amp; Run a program to start.</div>
      </div>
      <div class="screen-footer" id="sessionInfo"><i class="fa-solid fa-circle-info"></i> Session idle</div>
    </div>
    <div class="side-panel">
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-sliders"></i> Control</div>
        <div class="exec-controls">
          <div class="exec-btn-row">
            <button id="pauseBtn" class="exec-btn" disabled><i class="fa-solid fa-pause"></i> Pause</button>
            <button id="stepBtn" class="exec-btn" disabled><i class="fa-solid fa-forward-step"></i> Step</button>
          </div>
          <label class="speed-label">
            <i class="fa-solid fa-gauge-high"></i>
            <span>Speed</span>
            <input id="speedSlider" type="range" min="0" max="100" value="100" class="speed-slider">
            <span id="speedValue" class="speed-value">Max</span>
          </label>
        </div>
      </div>
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-microchip"></i> Registers</div>
        <pre id="regs" class="mono reg-grid">(no process)</pre>
      </div>
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-list"></i> Log</div>
        <pre id="log" class="mono">Ready.</pre>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/mode/simple.min.js"></script>
