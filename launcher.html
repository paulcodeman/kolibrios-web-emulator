<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KolibriOS Desktop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body class="launcher-page">
    <nav class="navbar launcher-navbar">
      <a href="index.html" class="navbar-brand">KolibriOS Emulator</a>
      <div class="navbar-links">
        <a href="launcher.html" class="active"><i class="fa-solid fa-display"></i> Desktop</a>
        <a href="apps.html"><i class="fa-solid fa-cubes"></i> Apps</a>
        <a href="marketplace.html"><i class="fa-solid fa-store"></i> Marketplace</a>
        <a href="ide/index.html"><i class="fa-solid fa-code"></i> IDE</a>
      </div>
    </nav>
    <div id="app" class="launcher-app">
      <div class="launcher-toolbar">
        <div class="launcher-status" id="status"><i class="fa-solid fa-spinner fa-pulse"></i> Booting desktop...</div>
        <button id="restoreDefaultsBtn" class="screen-action launcher-action" type="button"><i class="fa-solid fa-rotate-left"></i> Restore Defaults</button>
        <button id="mountFolderBtn" class="screen-action launcher-action" type="button"><i class="fa-solid fa-folder-open"></i> Mount Folder</button>
        <label class="screen-action launcher-action launcher-select" for="cpuBackendSelect">
          <i class="fa-solid fa-microchip"></i>
          <span>CPU</span>
          <select id="cpuBackendSelect">
            <option value="js" selected>JS CPU</option>
            <option value="wasm">WASM CPU</option>
            <option value="auto">Auto CPU</option>
          </select>
        </label>
        <button id="fullscreenBtn" class="screen-action launcher-action" type="button"><i class="fa-solid fa-expand"></i> Fullscreen</button>
      </div>

      <div class="workspace launcher-workspace" id="workspace">
        <div class="workspace-empty" id="workspaceEmpty"><i class="fa-solid fa-cloud-arrow-down"></i> Starting bundled KolibriOS desktop...</div>
      </div>

      <div class="launcher-session-info" id="sessionInfo"><i class="fa-solid fa-circle-info"></i> Session idle</div>

      <div class="launcher-hidden-ui" aria-hidden="true">
        <input id="fileInput" type="file" accept=".kex,.bin,.com" tabindex="-1" />
        <button id="pickRootBtn" type="button" tabindex="-1">Pick FS Root</button>
        <button id="clearRootBtn" type="button" tabindex="-1">Clear FS Root</button>
        <div id="fsRootStatus">FS root: builtin</div>
        <button id="runBtn" type="button" tabindex="-1">Run</button>
        <button id="stopBtn" type="button" tabindex="-1">Stop</button>
        <label><input id="traceSyscalls" type="checkbox" tabindex="-1" /></label>
        <label><input id="traceImages" type="checkbox" tabindex="-1" /></label>
        <label><input id="traceOpcodes" type="checkbox" tabindex="-1" /></label>
        <div id="screenPanel"></div>
        <pre id="info">No image loaded.</pre>
        <pre id="log">Ready.</pre>
      </div>
    </div>

    <script>
      window.KosEmuPageConfig = {
        autoBootBundledDesktop: true,
        assetKey: "builtinKolibriRoot",
        launchPath: "/sys/LAUNCHER",
        cpuBackend: "js",
        skipPersistedRootRestore: true
      };
    </script>
    <script src="src/boot.js"></script>
    <script src="src/vendor/lzma_worker-min.js"></script>
    <script src="src/vendor/fflate-umd.js"></script>
    <script src="src/core/utils.js"></script>
    <script src="src/core/loader.js"></script>
    <script src="src/gfx/text.js"></script>
    <script src="src/gfx/kolibri-font-assets.js"></script>
    <script src="src/gfx/kolibri-font.js"></script>
    <script src="src/gfx/kolibri-skin-assets.js"></script>
    <script src="src/gfx/kolibri-skin.js"></script>
    <script src="src/gfx/surface.js"></script>
    <script src="src/emulator/core-access.js"></script>
    <script src="src/emulator/host-libs/registry.js"></script>
    <script src="src/emulator/host-libs/http.obj.js"></script>
    <script src="src/emulator/host-libs/cnv_png.obj.js"></script>
    <script src="src/emulator/host-libs/libimg.obj.js"></script>
    <script src="src/emulator/host-libs/libini.obj.js"></script>
    <script src="src/emulator/host-libs/runtime.js"></script>
    <script src="src/emulator/emulator-host.js"></script>
    <script src="src/emulator/core-runtime.js"></script>
    <script src="src/emulator/core-execute.js"></script>
    <script src="src/emulator/emulator-syscalls.js"></script>
    <script src="src/emulator/wasm-cpu.generated.js"></script>
    <script src="src/emulator/wasm-cpu-runtime.js"></script>
    <script src="src/emulator/emulator.js"></script>
    <script src="src/ui/browser-fs.js"></script>
    <script src="src/ui/app-ui.js"></script>
    <script src="src/ui/builtin-root.js"></script>
    <script src="src/ui/session-shared.js"></script>
    <script src="src/ui/session-manager.js"></script>
    <script src="assets_kolibrios/builtin-root.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
