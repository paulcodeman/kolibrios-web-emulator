<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KolibriOS Emulator — Apps</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html" class="navbar-brand">KolibriOS Emulator</a>
      <div class="navbar-links">
        <a href="launcher.html"><i class="fa-solid fa-display"></i> Desktop</a>
        <a href="apps.html" class="active"><i class="fa-solid fa-cubes"></i> Apps</a>
        <a href="marketplace.html"><i class="fa-solid fa-store"></i> Marketplace</a>
        <a href="ide/index.html"><i class="fa-solid fa-code"></i> IDE</a>
      </div>
      <div class="status" id="status">Idle</div>
    </nav>

    <div id="app">
      <section class="controls">
        <label class="file-picker">
          <input id="fileInput" type="file" accept=".kex,.bin,.com" />
          <i class="fa-solid fa-folder-open"></i> <span>Select .kex</span>
        </label>
        <a class="button-link" href="launcher.html"><i class="fa-solid fa-display"></i> Desktop</a>
        <a class="button-link" href="marketplace.html"><i class="fa-solid fa-store"></i> Marketplace</a>
        <button id="pickRootBtn" type="button"><i class="fa-solid fa-folder-tree"></i> Pick FS Root</button>
        <button id="clearRootBtn" type="button" disabled><i class="fa-solid fa-trash-can"></i> Clear FS Root</button>
        <div id="fsRootStatus" class="fs-root-status"><i class="fa-solid fa-hard-drive"></i> FS root: not mounted</div>
        <button id="runBtn" class="primary" disabled><i class="fa-solid fa-play"></i> Run</button>
        <button id="stopBtn" disabled><i class="fa-solid fa-stop"></i> Stop</button>
        <label class="toggle cpu-backend-control">
          <i class="fa-solid fa-microchip"></i>
          <span>CPU</span>
          <select id="cpuBackendSelect">
            <option value="js">JS CPU</option>
            <option value="wasm">WASM CPU</option>
            <option value="auto">Auto CPU</option>
          </select>
        </label>
        <label class="toggle">
          <input id="traceSyscalls" type="checkbox" />
          <i class="fa-solid fa-bug"></i>
          <span>Trace syscalls</span>
        </label>
        <label class="toggle">
          <input id="traceImages" type="checkbox" />
          <i class="fa-solid fa-camera"></i>
          <span>Trace images</span>
        </label>
        <label class="toggle">
          <input id="traceOpcodes" type="checkbox" />
          <i class="fa-solid fa-code"></i>
          <span>Trace opcodes</span>
        </label>
      </section>

      <section class="main">
        <div class="screen-panel" id="screenPanel">
          <div class="screen-panel-header">
            <div class="screen-title"><i class="fa-solid fa-display"></i> Workspace</div>
            <button id="fullscreenBtn" class="screen-action" type="button"><i class="fa-solid fa-expand"></i> Fullscreen</button>
          </div>
          <div class="workspace" id="workspace">
            <div class="workspace-empty" id="workspaceEmpty"><i class="fa-solid fa-download"></i> Run or drop a .kex here to start it.</div>
          </div>
          <div class="screen-footer" id="sessionInfo"><i class="fa-solid fa-circle-info"></i> Session idle</div>
        </div>

        <div class="side-panel">
            <div class="card">
              <div class="card-title"><i class="fa-solid fa-image"></i> Image Info</div>
              <pre id="info" class="mono">No image loaded.</pre>
            </div>
            <div class="card">
              <div class="card-title"><i class="fa-solid fa-microchip"></i> Registers</div>
              <pre id="regs" class="mono reg-grid">(no process)</pre>
            </div>
            <div class="card">
              <div class="card-title"><i class="fa-solid fa-sliders"></i> Control</div>
              <div class="exec-controls">
                <div class="exec-btn-row">
                  <button id="pauseBtn" class="exec-btn" disabled><i class="fa-solid fa-pause"></i> Pause</button>
                  <button id="stepBtn" class="exec-btn" disabled><i class="fa-solid fa-forward-step"></i> Step</button>
                </div>
                <label class="speed-label">
                  <i class="fa-solid fa-gauge-high"></i>
                  <span>Speed</span>
                  <input id="speedSlider" type="range" min="0" max="100" value="100" class="speed-slider">
                  <span id="speedValue" class="speed-value">Max</span>
                </label>
              </div>
            </div>
            <div class="card">
              <div class="card-title"><i class="fa-solid fa-list"></i> Log</div>
              <pre id="log" class="mono">Ready.</pre>
            </div>
        </div>
      </section>
    </div>

    <script src="src/boot.js"></script>
    <script src="src/vendor/lzma_worker-min.js"></script>
    <script src="src/vendor/fflate-umd.js"></script>
    <script src="src/core/utils.js"></script>
    <script src="src/core/loader.js"></script>
    <script src="src/gfx/text.js"></script>
    <script src="src/gfx/kolibri-font-assets.js"></script>
    <script src="src/gfx/kolibri-font.js"></script>
    <script src="src/gfx/kolibri-skin-assets.js"></script>
    <script src="src/gfx/kolibri-skin.js"></script>
    <script src="src/gfx/surface.js"></script>
    <script src="src/emulator/core-access.js"></script>
    <script src="src/emulator/host-libs/registry.js"></script>
    <script src="src/emulator/host-libs/http.obj.js"></script>
    <script src="src/emulator/host-libs/cnv_png.obj.js"></script>
    <script src="src/emulator/host-libs/libimg.obj.js"></script>
    <script src="src/emulator/host-libs/libini.obj.js"></script>
    <script src="src/emulator/host-libs/runtime.js"></script>
    <script src="src/emulator/emulator-host.js"></script>
    <script src="src/emulator/core-runtime.js"></script>
    <script src="src/emulator/core-execute.js"></script>
    <script src="src/emulator/emulator-syscalls.js"></script>
    <script src="src/emulator/wasm-cpu.generated.js"></script>
    <script src="src/emulator/wasm-cpu-runtime.js"></script>
    <script src="src/emulator/emulator.js"></script>
    <script src="src/ui/browser-fs.js"></script>
    <script src="src/ui/app-ui.js"></script>
    <script src="src/ui/session-shared.js"></script>
    <script src="src/ui/session-manager.js"></script>
    <script src="src/ui/builtin-root.js"></script>
    <script src="assets_kolibrios/builtin-root.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
